[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
hilt = "2.60.1"
hiltAndroidx = "1.4.0"
work = "2.12.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
# Test-only; Turbine 1.2.1 pulls coroutines 1.10.2 onto the test classpath anyway. The app resolves 1.9.0.
coroutines = "1.10.2"
turbine = "1.2.1"
navigation3 = "1.2.0"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
testRunner = "1.7.0"
appcompat = "1.8.0"
kotlinxSerialization = "1.12.0"
detekt = "2.0.0-alpha.6"
spotless = "8.10.4"
ktlint = "1.8.0"
composeRules = "0.6.8"
konsist = "0.18.1"
haze = "2.1.0"
composeUnstyled = "2.10.2"
screenshot = "0.0.1-alpha16"
robolectric = "4.17"
room3 = "3.0.3"
# Same version Room 3.0.3 pulls in (checked in its POM); declared so the driver import is explicit.
sqlite = "2.7.1"
# 4.19.1 is the minimum (4.18-4.19.0 return the wrong type for NULL columns); 4.20.0 has the Room 3 driver.
sqlcipher = "4.20.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
